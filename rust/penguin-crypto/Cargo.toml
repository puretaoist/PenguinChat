[package]
name = "penguin-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "QQ 协议用到的加密原语：TEA（QQ 变体）、MD5、P-256 ECDH"

[dependencies]
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
