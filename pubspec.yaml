name: qqclient
description: "Flutter client for Android"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理：Riverpod（编译期安全，替代 Provider）
  flutter_riverpod: ^2.6.1

  # Riverpod 核心。L3 的接线层（client_api/session_providers.dart）必须保持
  # 纯 Dart（AGENTS.md §1.1：底层不得 import Flutter），所以那里用 riverpod，
  # L4 用 flutter_riverpod 的 ProviderScope / ConsumerWidget 消费同一批 provider
  # ——flutter_riverpod 本就是 riverpod + Flutter 绑定，不是两套状态管理。
  riverpod: ^2.6.1

  # 网络：HTTP 配置拉取（长连接用 dart:io Socket，无需依赖）
  dio: ^5.7.0

  # 加密：AES / RSA / SHA（TEA 为 QQ 专用算法，自研实现见 kernel/crypto/tea.dart）
  pointycastle: ^3.9.1
  cryptography: ^2.7.0

  # 本地存储：轻量 KV（会话缓存 / 配置）
  shared_preferences: ^2.3.3

  # 平台数据目录：Android 上没有纯 Dart 的办法拿到应用私有目录，
  # 而 ChatStore 需要一个可持久化的 dataDir（systemTemp 会被系统清理）。
  path_provider: ^2.1.6

  # 打开系统浏览器（验证页兜底入口 / 二维码溢出时用）
  url_launcher: ^6.3.0

  # 应用内 WebView：滑动验证要**在应用内**完成（与官方同形）。
  # 为什么必须应用内：验证页所在环境采集到的东西会与登录包里的设备身份比对，
  # 系统浏览器那条路已被实测排除（见 docs/PITFALLS.md C8 候选 (a)），
  # 且只有应用内 WebView 才拿得到页面回传的 ticket（lib/ui/pages/qq8_verify_page.dart）。
  #
  # ⚠️ 别换成 flutter_inappwebview：它能在文档开头注入脚本，看着更合适，
  # 但它的 Android 实现（1.1.3，2024-10 后未再发版）在 AGP 9 上构建不过——
  # `getDefaultProguardFile('proguard-android.txt')` 已被 AGP 移除，
  # 2026-09-21 CI 实测 `:flutter_inappwebview_android` 评估直接失败。
  webview_flutter: ^4.14.1
  # 显式声明 Android 实现：本页要直接用它独有的观测口
  # （onJsPrompt/onJsAlert/onConsoleMessage——腾讯系 WebView 桥常拿 prompt 传参）。
  webview_flutter_android: ^4.13.0

  # 分享日志/文件到系统分享面板（登录页"导出日志"用）
  share_plus: ^10.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/theme.json
    # 后端适配表（OneBot 各实现的字段差异，数据驱动；见 lib/kernel/onebot/backend_profile.dart）
    - assets/backends/
