name: build

# 触发条件：
#  - 手动触发（Actions 页面 Run workflow，可选 build_mode）
#  - push 到 main / master → 构建 debug
#  - 打 tag（v*）→ 构建 release，并自动附加到 GitHub Release
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建类型 (debug / release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 环境准备 ----------
      # JDK 17：AGP 9.x 要求 JDK 17+
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter SDK：用 stable 频道；子动作自带 pub-cache / SDK 缓存
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------- 依赖 ----------
      - name: Install dependencies
        run: flutter pub get

      # ---------- 静态检查 ----------
      - name: Analyze
        run: flutter analyze || true

      # ---------- 自检 ----------
      # 全部纯 Dart 自检，逐个跑并汇总：
      #   qq8_tlv / qq8_sso / qq8_selftest   协议编解码（含 oicq 黄金向量）
      #   qq8_tran                            传输层（本地 mock TCP 服务器）
      #   qq8_login / qq8_profile             登录主流程、多版本档案
      #   onebot / segment / session          日用线
      #   chat_store / session_providers      L3 数据层与接线层（闸门拒绝路径）
      #   storage / safety                    存储预算、账号防护
      #   log                                 日志脱敏与体积闸门
      #   tea_compat_check / selftest         TEA 编解码、内核基础
      #
      # 用通配遍历而不是逐条列举——新增自检不必再改工作流，
      # 也就不会出现"写了测试但 CI 没跑"的情况。
      - name: Self-tests
        run: |
          set -u
          fail=0
          for f in tool/*_selftest.dart tool/tea_compat_check.dart tool/selftest.dart; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            if dart run "$f"; then
              echo "::endgroup::"
            else
              echo "::error file=$f::$f 自检失败"
              echo "::endgroup::"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "有自检未通过"
            exit 1
          fi
          echo "全部自检通过"

      # ---------- 登录组包 dry-run ----------
      # 不联网、不需要账号。验证三层信封都能组装出来，且首 4 字节声明的
      # 长度与实体一致（组包长度算错是登录失败最常见的隐蔽原因）。
      - name: Login dry-run
        run: |
          out=$(dart run tool/qq8_live_smoke.dart)
          echo "$out"
          if ! echo "$out" | grep -q "✓ 与实体一致"; then
            echo "::error::登录包长度自洽性检查失败"
            exit 1
          fi
          if echo "$out" | grep -q "✗"; then
            echo "::error::dry-run 报告里有失败项"
            exit 1
          fi

      # 标准单元测试（失败不阻断打包，仅作记录）
      - name: Unit tests
        run: flutter test --reporter expanded || true

      # ---------- 工程修正 ----------
      # 1) 仓库不提交 android/local.properties（本机绝对路径），
      #    Flutter 的 Gradle 插件从这里读 flutter.sdk，缺失会直接报错，故动态生成。
      # 2) gradlew 从 Windows 入库时可能带 CRLF 或缺失可执行位，统一修正。
      - name: Prepare Android build
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" >> android/local.properties
          echo "--- android/local.properties ---"
          cat android/local.properties
          chmod +x android/gradlew

      # 预装 NDK：Flutter Gradle 插件需要它来 strip 引擎 .so 的调试符号。
      # ubuntu-latest 的 runner 通常已带，这里显式确保版本一致，避免构建中途触发下载。
      - name: Ensure NDK
        run: |
          NDK_VER="28.2.13676358"
          SDKM="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/$NDK_VER/source.properties" ]; then
            echo "Installing NDK $NDK_VER ..."
            yes | "$SDKM" --install "ndk;$NDK_VER" || true
          else
            echo "NDK $NDK_VER already present"
          fi
          ls "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------- 打包 ----------
      # 只出 arm64-v8a（`--target-platform android-arm64`）。
      # 实测（GitHub artifact 体积）：3-ABI debug 68.8MB → arm64-only 44.7MB。
      # 降幅不到 2/3 是因为 debug 包本身就大（debug 引擎 + JIT，不随 ABI 数缩小）；
      # 被去掉的 armeabi-v7a / x86_64 只有老 32 位机和模拟器用得上，本项目不发。
      # tag 推送一律走 release（见下），这里先排除 tag，
      # 否则 v* tag 会同时命中两条构建命令。
      - name: Build APK (debug, arm64-v8a)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug') }}
        run: flutter build apk --debug --target-platform android-arm64

      # release 同样只出 arm64：既然只要一个 ABI，就用不上 --split-per-abi
      # （那是给多 ABI 拆包用的），单平台直接出一个 app-release.apk。
      # 触发场景：手动触发选 release，或推 v* tag —— tag 出来的包会挂到
      # Release 页面（下载不需要登录），是给真机测试的那一份。
      - name: Build APK (release, arm64-v8a)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release') }}
        run: flutter build apk --release --target-platform android-arm64

      # ---------- 产物上传 ----------
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- Release 附件（仅打 tag 时） ----------
      - name: Attach APKs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
