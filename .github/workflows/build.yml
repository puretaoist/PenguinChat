name: build

# 触发条件：
#  - 手动触发（Actions 页面 Run workflow，可选 build_mode）
#  - push 到 main / master → 构建 debug
#
# 说明（2026-09-11 决定）：**不自动发布 GitHub Release**，产物只走 Actions
# artifact（tag 触发与 Release 附件步骤均已移除）。需要分发的 release APK
# 用手动触发选 release 构建后自行取用。
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建类型 (debug / release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 环境准备 ----------
      # JDK 17：AGP 9.x 要求 JDK 17+
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter SDK：用 stable 频道；子动作自带 pub-cache / SDK 缓存
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------- 依赖 ----------
      - name: Install dependencies
        run: flutter pub get

      # ---------- 静态检查 ----------
      - name: Analyze
        run: flutter analyze || true

      # ---------- 自检 ----------
      # 全部纯 Dart 自检，逐个跑并汇总，任一失败即中断。
      #
      # 用通配遍历而不是逐条列举——新增自检不必再改工作流，
      # 也就不会出现"写了测试但 CI 没跑"的情况。
      - name: Self-tests
        run: |
          set -u
          fail=0
          for f in tool/*_selftest.dart tool/tea_compat_check.dart tool/selftest.dart; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            if dart run "$f"; then
              echo "::endgroup::"
            else
              echo "::error file=$f::$f 自检失败"
              echo "::endgroup::"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "有自检未通过"
            exit 1
          fi
          echo "全部自检通过"

      # ---------- 离线组包校验 ----------
      # 不联网、不需要账号。校验组包结果的长度自洽性。
      - name: Offline pack check
        run: |
          out=$(dart run tool/qq8_live_smoke.dart)
          echo "$out"
          if ! echo "$out" | grep -q "✓ 与实体一致"; then
            echo "::error::登录包长度自洽性检查失败"
            exit 1
          fi
          if echo "$out" | grep -q "✗"; then
            echo "::error::dry-run 报告里有失败项"
            exit 1
          fi

      # 标准单元测试（含 UI widget 测试）。
      #
      # ⚠️ 这里**不再带 `|| true`**。
      # `tool/` 下的自测是纯 Dart，跑不了 Widget；能覆盖 UI 接线的只有这一条。
      # 之前让它带 `|| true`，等于「唯一验证 UI 的东西挂了也不阻断构建」——
      # 于是 test/ui_test.dart 一加进来就抓到两个真实缺陷
      # （ListTile 被带背景色的 DecoratedBox 包住 / 空注册表下崩溃），
      # 而它们此前完全无声。
      - name: Unit tests
        run: flutter test --reporter expanded

      # ---------- 工程修正 ----------
      # 1) 仓库不提交 android/local.properties（本机绝对路径），
      #    Flutter 的 Gradle 插件从这里读 flutter.sdk，缺失会直接报错，故动态生成。
      # 2) gradlew 从 Windows 入库时可能带 CRLF 或缺失可执行位，统一修正。
      - name: Prepare Android build
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" >> android/local.properties
          echo "--- android/local.properties ---"
          cat android/local.properties
          chmod +x android/gradlew

      # 预装 NDK：Flutter Gradle 插件需要它来 strip 引擎 .so 的调试符号。
      # ubuntu-latest 的 runner 通常已带，这里显式确保版本一致，避免构建中途触发下载。
      - name: Ensure NDK
        run: |
          NDK_VER="28.2.13676358"
          SDKM="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/$NDK_VER/source.properties" ]; then
            echo "Installing NDK $NDK_VER ..."
            yes | "$SDKM" --install "ndk;$NDK_VER" || true
          else
            echo "NDK $NDK_VER already present"
          fi
          ls "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------- 打包 ----------
      # 只出 arm64-v8a（`--target-platform android-arm64`）。
      # 实测（GitHub artifact 体积）：3-ABI debug 68.8MB → arm64-only 44.7MB。
      # 降幅不到 2/3 是因为 debug 包本身就大（debug 引擎 + JIT，不随 ABI 数缩小）；
      # 被去掉的 armeabi-v7a / x86_64 只有老 32 位机和模拟器用得上，本项目不发。
      - name: Build APK (debug, arm64-v8a)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' }}
        run: flutter build apk --debug --target-platform android-arm64

      # release 同样只出 arm64：既然只要一个 ABI，就用不上 --split-per-abi
      # （那是给多 ABI 拆包用的），单平台直接出一个 app-release.apk。
      # 触发场景：仅手动触发选 release（实测 17.8MB；签名与 debug 包统一，
      # 见 android/app/build.gradle.kts 的 signingConfigs.unified）。
      - name: Build APK (release, arm64-v8a)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' }}
        run: flutter build apk --release --target-platform android-arm64

      # ---------- 产物上传 ----------
      # 只传 artifact，不发布 Release —— 见文件头"说明"。
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
